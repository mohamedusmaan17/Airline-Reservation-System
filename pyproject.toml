[project]
name = "airline-reservation-system"
version = "2.0.0"
description = "Airline Reservation System API & Frontend"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "sqlalchemy==2.0.31",
    "pydantic==2.7.4",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.1.3",
    "python-multipart==0.0.9",
    "reportlab==4.2.2",
    "qrcode[pil]==7.4.2",
    "openpyxl==3.1.5",
    "Pillow==10.4.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = ["B008", "E501", "BLE001", "DTZ", "B905"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header", "Depends", "Query", "Path", "Body", "Header"]

[tool.pyright]
